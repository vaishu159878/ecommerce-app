---
services:

  frontend:
    build:
      context: ./client
      args:
        REACT_APP_API_URL: "http://15.206.88.76:5000"
    image: ecommerce-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./server
    image: ecommerce-backend:latest
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      FRONT_DOMAIN: "http://15.206.88.76:8080"
      DB_URL: ${DB_URL}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:16-alpine

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ecommerce-postgres-data:/var/lib/postgresql/data
      - ./server/models/tables.sql:/docker-entrypoint-initdb.d/tables.sql:ro

volumes:
  ecommerce-postgres-data:
    name: ecommerce-postgres-data
